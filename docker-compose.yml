# Dev-only JWT signing secret, defined once and shared by user-service (signs) and api-gateway
# (validates) so the two can never drift. Neither service has a default of its own: outside this
# compose file JWT_SECRET must be set explicitly, or startup fails. Export JWT_SECRET in your
# shell to override this value.
x-jwt-secret: &jwt-secret ${JWT_SECRET:-dev-only-jwt-signing-secret-change-me-before-any-real-deployment-1234567890}

services:
  # ---------- Data stores ----------
  mongo:
    image: mongo:7
    # No host port published: this container is only reached by recommendation-service via
    # the compose network's `mongo:27017` DNS name. Publishing 27017 here would conflict with
    # the separately-run mflix-mongo container, which also binds host port 27017 for
    # catalog-service/search-service (see README "Local dev").
    volumes: ["mongo-data:/data/db"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mflix_reviews
      POSTGRES_USER: mflix
      POSTGRES_PASSWORD: mflix
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates user-service's mflix_users database alongside POSTGRES_DB. Runs only when the
      # data volume is empty; on an existing volume, `docker compose down -v` to re-run it.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # ---------- Messaging (KRaft mode, no Zookeeper needed) ----------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for other compose services (advertised as the `kafka` service DNS name);
      # PLAINTEXT_HOST is for tools/services run directly on the host (e.g. `mvnw spring-boot:run`
      # against a service not yet added to this compose file) via localhost:29092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Must be a base64-encoded 16-byte UUID for KRaft storage formatting, not an arbitrary string.
      CLUSTER_ID: av6IvC-3RqSGcHd3kMx8Og
      # Single-broker dev cluster: the default replication factor of 3 for these internal
      # topics can never succeed with only 1 broker registered, which silently breaks every
      # consumer group (no __consumer_offsets topic means no group coordinator).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports: ["9092:9092", "29092:29092"]

  # ---------- Spring Cloud infra ----------
  config-server:
    build: ./services/config-server
    ports: ["8888:8888"]
    # Clones config-repo/ from this project's GitHub repo at startup (main branch), so it needs
    # network access and serves only merged config, not local edits. Set CONFIG_REPO_URI to
    # serve from a fork or another clone. See docs/adr/0009 — not yet consumed by any client
    # service.
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

  # eureka-server intentionally omitted: services/eureka-server has no source, only a README
  # stub (see ADR-0007 — no dynamic service discovery at single-instance local scale, every
  # inter-service call uses a configured URL instead). A `build:` entry here with nothing to
  # build would break `docker compose up` for every service below that depended on it.

  # ---------- API gateway ----------
  api-gateway:
    build: ./services/api-gateway
    ports: ["8080:8080"]
    environment:
      # Configured base URLs, matching every other service's inter-service call pattern
      # (e.g. search-service's CATALOG_SERVICE_URL) — NOT Eureka discovery. See ADR-0007 for
      # why: no service in this repo registers with Eureka yet, so routing through it here
      # would be the first consumer of infrastructure nothing else uses.
      CATALOG_SERVICE_URL: http://catalog-service:8081
      SEARCH_SERVICE_URL: http://search-service:8082
      REVIEW_SERVICE_URL: http://review-service:8083
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8084
      USER_SERVICE_URL: http://user-service:8085
      # Shared with user-service via the x-jwt-secret anchor at the top of this file.
      JWT_SECRET: *jwt-secret
      # OTLP/HTTP trace export target — see docs/adr/0008. Same value in every service below.
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

  # ---------- Domain services ----------
  catalog-service:
    build: ./services/catalog-service
    ports: ["8081:8081"]
    environment:
      # Points at the mongodb-atlas-local container run separately on the host
      # (already seeded with sample_mflix), not the generic `mongo` service above.
      # host.docker.internal lets the container reach the host's published port.
      MONGODB_URI: mongodb://host.docker.internal:27017/sample_mflix?directConnection=true
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [kafka]

  search-service:
    build: ./services/search-service
    ports: ["8082:8082"]
    environment:
      # Same mongodb-atlas-local container on the host as catalog-service (see its
      # comment above), just a different database — not the generic `mongo` service.
      MONGODB_URI: mongodb://host.docker.internal:27017/sample_mflix_search?directConnection=true
      # Activates application-local.yml (gitignored) for per-developer overrides — e.g. a real
      # embedding-provider API key — layered on top of application.yml. Harmless if that file
      # doesn't exist (nothing to clone contains one): Spring just finds no profile-specific
      # file and falls back to application.yml's defaults, same as before.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Docker network service name, not localhost:8081 (which only resolves to the container itself).
      CATALOG_SERVICE_URL: http://catalog-service:8081
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [kafka]

  review-service:
    build: ./services/review-service
    ports: ["8083:8083"]
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/mflix_reviews
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [postgres, kafka]

  recommendation-service:
    build: ./services/recommendation-service
    ports: ["8084:8084"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/sample_mflix_recsys
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEARCH_SERVICE_URL: http://search-service:8082
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [mongo, redis, kafka]

  user-service:
    build: ./services/user-service
    ports: ["8085:8085"]
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/mflix_users
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Shared with api-gateway via the x-jwt-secret anchor at the top of this file.
      JWT_SECRET: *jwt-secret
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [postgres, kafka]

  # ---------- Observability ----------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    # 16686: UI. 4317: OTLP/gRPC receiver. 4318: OTLP/HTTP receiver — what every service here
    # actually exports to (management.opentelemetry.tracing.export.otlp.endpoint), since Spring
    # Boot's OTLP tracing exporter defaults to HTTP, not gRPC. See docs/adr/0008.
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:11.0.0
    ports: ["3001:3000"]
    # Auto-provisions the Prometheus datasource — see infra/grafana/provisioning/.
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning"]
    depends_on: [prometheus]

volumes:
  mongo-data:
  postgres-data:
