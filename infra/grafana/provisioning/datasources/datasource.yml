# Auto-provisions the Prometheus datasource on grafana container start, so metrics are queryable
# immediately instead of requiring a manual "Add data source" click every time the container is
# recreated. The fixed uid is what the provisioned dashboards (../dashboards/json) refer to.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
