# Scrapes every service's Actuator-exposed /actuator/prometheus endpoint over the docker-compose
# network. Referenced by the `prometheus` service in ../docker-compose.yml. See docs/adr/0008.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8081"]

  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["search-service:8082"]

  - job_name: review-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["review-service:8083"]

  - job_name: recommendation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["recommendation-service:8084"]

  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["user-service:8085"]

  - job_name: assistant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["assistant-service:8086"]
