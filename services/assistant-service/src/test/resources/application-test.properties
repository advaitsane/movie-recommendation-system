# The OpenAI API, search-service and recommendation-service are all replaced by StubHttpServer,
# whose URL each test class sets with @DynamicPropertySource. No real model is ever called.
spring.ai.openai.api-key=test-key
spring.ai.openai.max-retries=0
spring.ai.openai.chat.model=gpt-test
# No tracing export during tests: nothing listens on localhost:4318.
management.tracing.export.enabled=false
