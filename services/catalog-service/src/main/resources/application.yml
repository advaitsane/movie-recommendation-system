# MongoDB Configuration
# Connection URI should be provided with the MONGODB_URI environment variable.
# Defaults to the mflix-mongo container on localhost (see the root README's
# "Local dev"); override to point at your own local/Atlas instance instead.
spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/sample_mflix}
    database: sample_mflix
  application:
    name: catalog-service
  jackson2:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Server Configuration
server:
  port: 8081

# Observability: /actuator/prometheus is scraped by the prometheus container; traces export via
# OTLP/HTTP to the jaeger container. 100% sampling is a deliberate dev-only choice (this is a
# low-traffic local deployment) — see docs/adr/0008.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    sampling:
      probability: 1.0
  # The property that actually gates the OTLP trace exporter's creation, confirmed via
  # `--debug`'s condition-evaluation report — NOT management.otlp.tracing.endpoint, which looks
  # equally plausible (it binds a real OtlpTracingProperties class) but silently has no effect:
  # OtlpTracingConfigurations.ConnectionDetails only activates on this exact property. See
  # docs/adr/0008 — this is the one thing decompiling the properties class alone didn't catch.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    # spring-boot-starter-opentelemetry also auto-enables an OTLP metrics push exporter by
    # default; Jaeger only ingests OTLP traces (and logs), not metrics, so left on this silently
    # fails every export interval. Metrics are Prometheus-scraped (pull), not OTLP-pushed here.
    metrics:
      export:
        enabled: false

# Kafka topic names — kept in one place so search-service's consumer config can
# be kept in sync with these values.
app:
  kafka:
    topics:
      movie-created: movie.created
      movie-updated: movie.updated
      movie-deleted: movie.deleted

# Logging Configuration
logging:
  level:
    com.movies.catalog: ${LOG_LEVEL:INFO}
    org.mongodb.driver: WARN
    org.mongodb.driver.connection: ERROR
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p){highlight} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %5p --- [%15.15t] %-40.40logger{39} : %m%n"
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

# API Documentation (Swagger/OpenAPI)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tryItOutEnabled: false
    displayRequestDuration: true
    deepLinking: true
    defaultModelsExpandDepth: 1
    defaultModelExpandDepth: 1
