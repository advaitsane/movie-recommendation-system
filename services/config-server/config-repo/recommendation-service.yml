# Served by config-server, but NOT read by recommendation-service yet: no service is a Spring Cloud
# Config client (ADR-0009, phase 1). Live config is still the service's own application.yml
# (services/recommendation-service/src/main/resources/); these values mirror it so the server has
# something real to serve and test against. Keep both in sync until clients are migrated.

server:
  port: 8084

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/sample_mflix_recsys}
    database: sample_mflix_recsys
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

search:
  service:
    url: ${SEARCH_SERVICE_URL:http://localhost:8082}
