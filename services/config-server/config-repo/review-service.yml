# Served by config-server, but NOT read by review-service yet: no service is a Spring Cloud
# Config client (ADR-0009, phase 1). Live config is still the service's own application.yml
# (services/review-service/src/main/resources/); these values mirror it so the server has
# something real to serve and test against. Keep both in sync until clients are migrated.

server:
  port: 8083

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mflix_reviews}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
