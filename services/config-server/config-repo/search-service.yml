# Served by config-server, but NOT read by search-service yet: no service is a Spring Cloud
# Config client (ADR-0009, phase 1). Live config is still the service's own application.yml
# (services/search-service/src/main/resources/); these values mirror it so the server has
# something real to serve and test against. Keep both in sync until clients are migrated.

server:
  port: 8082

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/sample_mflix_search}
    database: sample_mflix_search
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8081}
