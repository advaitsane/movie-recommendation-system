# Test configuration for the Testcontainers-backed integration test.
# spring.mongodb.uri is left unset here so MongoDBTestContainersConfig provisions
# an isolated container and injects the connection string dynamically.

# Use a random port for tests to avoid conflicts
server.port=0

# Kafka isn't required for the context to start: no broker is provisioned for this test, so
# the listener container will keep retrying to connect in the background — same setup as
# search-service's own SearchServiceIntegrationTest.
spring.kafka.bootstrap-servers=localhost:9092

# Redis's connection factory is lazy (no eager connect on startup), and RecommendationCache
# catches every read/write failure and degrades to "treat as a miss" / "don't cache" — so no
# live Redis is required for this test either.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# search-service isn't running during this test; SearchServiceClient catches every failure
# (including connection refused) and degrades to an empty content-based signal.
search.service.url=http://localhost:8082

# The startup backfill would page through whatever catalog-service answers on localhost:8081.
# CatalogBackfillRunnerTest covers it against a stub instead.
catalog.backfill.enabled=false

logging.level.com.movies.recommendation=DEBUG
logging.level.org.mongodb.driver=INFO
