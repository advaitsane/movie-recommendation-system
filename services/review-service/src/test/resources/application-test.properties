# Test configuration for the Testcontainers-backed integration tests.
# spring.datasource.url is left unset here so ReviewServicePostgresTestContainersConfig
# provisions an isolated container and injects the connection string dynamically.

# Use a random port for tests to avoid conflicts
server.port=0

# Kafka isn't required for the context to start (KafkaTemplate connects lazily on first
# send); ReviewServiceIntegrationTest doesn't need a broker. OutboxKafkaIntegrationTest
# overrides this with @EmbeddedKafka's bootstrap-servers property instead.
spring.kafka.bootstrap-servers=localhost:9092

# Outbox poller tuned faster for tests so OutboxKafkaIntegrationTest doesn't wait 500ms+.
app.outbox.poll-delay-ms=200

logging.level.com.movies.review=DEBUG
