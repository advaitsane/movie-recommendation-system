# Test configuration for the Testcontainers-backed integration test.
# spring.mongodb.uri is left unset here so MongoDBTestContainersConfig provisions
# an isolated container and injects the connection string dynamically.

# Use a random port for tests to avoid conflicts
server.port=0

# Kafka isn't required for the context to start: no broker is provisioned for this test, so
# the listener container will keep retrying to connect in the background. That's expected —
# CatalogServiceIntegrationTest.java has the same setup for catalog-service's producer side.
spring.kafka.bootstrap-servers=localhost:9092

# catalog-service isn't running during this test; CatalogBackfillRunner catches its own
# failures and logs them without failing startup (see its Javadoc).
catalog.service.url=http://localhost:8081

logging.level.com.movies.search=DEBUG
logging.level.org.mongodb.driver=INFO
