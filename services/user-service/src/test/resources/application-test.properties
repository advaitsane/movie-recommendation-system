# Test configuration for the Testcontainers-backed integration test.
# spring.datasource.url is left unset here so UserServicePostgresTestContainersConfig
# provisions an isolated container and injects the connection string dynamically.

# Use a random port for tests to avoid conflicts
server.port=0

# Kafka isn't required for the context to start (KafkaTemplate connects lazily on first send);
# UserServiceIntegrationTest doesn't need a broker.
spring.kafka.bootstrap-servers=localhost:9092

jwt.secret=test-only-jwt-signing-secret-at-least-32-bytes-long-xyz
jwt.expiration=1h

logging.level.com.movies.user=DEBUG
